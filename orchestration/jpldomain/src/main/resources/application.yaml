spring:
  application:
    name: jpl
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
springdoc:
  swagger-ui:
    enabled: true
    path: /v1/jpl/swagger-ui.html
  api-docs:
    path: /v1/jpl-docs
  show-actuator: true
#  use-management-port: true
server:
  port: 8180
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
        step: 10s
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
      export:
        step: 10s # Export interval set to 10 seconds
  tracing:
    sampling:
      probability: 1.0
  server:
    port: 9180
