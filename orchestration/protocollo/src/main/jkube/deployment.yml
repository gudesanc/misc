spec:
  template:
    spec:
      containers:
        - env:
            - name: SERVER_PORT
              value: 8080
            - name: MANAGEMENT_SERVER_PORT
              value: 8180
          readinessProbe:
            httpGet:
              port: 8180
              path: actuator/health/readiness
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              port: 8180
              path: actuator/health/liveness
            initialDelaySeconds: 15
