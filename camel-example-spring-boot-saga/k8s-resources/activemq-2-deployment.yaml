apiVersion: apps/v1
kind: Deployment
metadata:
  name: jente-activemq
  labels:
    app.kubernetes.io/name: jente
    app.kubernetes.io/component: activemq-broker
spec:
  strategy:
    type: Recreate
  # `replicas` is hardcoded to `1`, because solution is not scalable.
  replicas: 1
  selector:
    matchLabels: 
      app: activemq-broker    
  template:
    metadata:
      labels:
        app: activemq-broker    
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - image: apache/activemq-artemis:latest-alpine
        imagePullPolicy: IfNotPresent
        name: activemq
        resources:
          requests:
            memory: 130Mi
            cpu: 10m
        env:
        - name: ACTIVEMQ_ADMIN_PASSWORD
          value: pwd
        - name: ACTIVEMQ_ADMIN_BIND_ALL
          value: "true"
        ports:
        - containerPort: 61616
          name: activemq-tcp
        - containerPort: 8161
          name: activemq-ui
        - containerPort: 5672
          name: activemq-amqp
        - containerPort: 61613
          name: activemq-stomp
        - containerPort: 1883
          name: activemq-mqtt
        - containerPort: 61614
          name: activemq-ws
        livenessProbe:
          tcpSocket:
            port: activemq-ui
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: activemq-tcp
          initialDelaySeconds: 10
          periodSeconds: 10