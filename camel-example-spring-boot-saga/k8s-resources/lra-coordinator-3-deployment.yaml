apiVersion: apps/v1
kind: Deployment
metadata:
  generation: 1
  labels:
    app: lra-coordinator
    csbexample: saga
  name: lra-coordinator
spec:
  replicas: 1
  selector:    
    matchLabels:
      app: lra-coordinator
      deploymentconfig: lra-coordinator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: lra-coordinator
        csbexample: saga
        deploymentconfig: lra-coordinator
    spec:
      containers:
      - imagePullPolicy: IfNotPresent
        env:
        - name: AB_JOLOKIA_OFF
          value: "true"
        livenessProbe:
          httpGet:
            path: /lra-coordinator
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 180
        name: lra-coordinator
        image: quay.io/jbosstm/lra-coordinator:latest
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /lra-coordinator
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
        volumeMounts:
        - mountPath: /home/jboss/ObjectStore
          name: lra-coordinator-data
      volumes:
      - name: lra-coordinator-data
        persistentVolumeClaim:
          claimName: lra-coordinator

