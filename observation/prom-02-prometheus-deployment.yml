apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.1
        args:
          - --config.file=/conf-prometheus/prometheus.yaml
        volumeMounts:
          - name: config-volume
            mountPath: /conf-prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
